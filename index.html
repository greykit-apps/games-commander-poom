<!DOCTYPE html>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --ega0:#000;--ega1:#0000aa;--ega3:#00aaaa;--ega7:#aaaaaa;--ega8:#555555;--ega9:#5555ff;
  --ega11:#55ffff;--ega12:#ff5555;--ega13:#ff55ff;--ega14:#ffff55;--ega15:#ffffff;
  --pix:"Press Start 2P",ui-monospace,"Courier New",monospace;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center;color:var(--ega15);font-family:var(--pix);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

/* the canon boot (games-meta STANDARD.md §3) reads these; its look is the
   family's, not this game's */
.gk-boot{--bg:#05070f;--accent:#54f2ff;--dim:#7d8aa8;--good:#4ade6a;
  font-family:"Courier New","Lucida Console",monospace;font-size:14px}

#stage{position:relative;overflow:hidden;background:#000}
#screen{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;left:0;top:0;width:320px;height:200px;transform-origin:0 0;font-size:8px;line-height:1.5}
img.px{image-rendering:pixelated;vertical-align:middle}
img.missing{filter:grayscale(1) brightness(.35)}
kbd{font:inherit;color:var(--ui-head)}
/* the pixel font has no left or right arrow: the fallback's are drawn larger to match its up and down */
.arr{font-size:1.5em;line-height:0}

/* ---- the logo ---- */
#logo{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none}
#logo .cmd{font-size:10px;letter-spacing:4px;color:var(--ega11);text-shadow:1px 1px 0 var(--ega1)}
#logo .poom{font-size:28px;line-height:1;margin-top:4px;color:var(--ega14);letter-spacing:2px;
  text-shadow:1px 1px 0 var(--ega12),2px 2px 0 var(--ega12),3px 3px 0 #aa0000,4px 4px 0 #aa0000,5px 5px 0 #000}
#logo .ep{margin-top:10px;font-size:7px;color:var(--ega13)}
#logo[hidden]{display:none}
#logo{transition:opacity 1s ease}
#logo.fading{opacity:0}
/* the logo by theme (game.js dressFor): the wasteland's is amber and rust */
#logo[data-look="wasteland"] .cmd{color:#ffb85a;text-shadow:1px 1px 0 #5a2410}
#logo[data-look="wasteland"] .poom{color:#ffd23f;text-shadow:1px 1px 0 #d07a36,2px 2px 0 #d07a36,3px 3px 0 #7a3a1c,4px 4px 0 #7a3a1c,5px 5px 0 #000}
#logo[data-look="wasteland"] .ep{color:#f0d0a0}
/* Thrum's (Book 2): pale teal and ice over the Hum's violet */
#logo[data-look="thrum"] .cmd{color:#6fe0c8;text-shadow:1px 1px 0 #10504e}
#logo[data-look="thrum"] .poom{color:#e6fff8;text-shadow:1px 1px 0 #6fe0c8,2px 2px 0 #2fb3a0,3px 3px 0 #613d86,4px 4px 0 #382252,5px 5px 0 #000}
#logo[data-look="thrum"] .ep{color:#c8b0e8}
/* Isla Garra's (Book 3): the radio's green over slate, a red alert edge */
#logo[data-look="claw"] .cmd{color:#5aff8a;text-shadow:1px 1px 0 #0a3a18}
#logo[data-look="claw"] .poom{color:#e8f0f4;text-shadow:1px 1px 0 #7a8898,2px 2px 0 #4a5664,3px 3px 0 #b01828,4px 4px 0 #4a0810,5px 5px 0 #000}
#logo[data-look="claw"] .ep{color:#a8c8b0}
/* Raptura's (Book 4): gold leaf over deep teal, a neon edge */
#logo[data-look="deep"] .cmd{color:#3ff0e0;text-shadow:1px 1px 0 #0a3a40}
#logo[data-look="deep"] .poom{color:#fff4d0;text-shadow:1px 1px 0 #f8d860,2px 2px 0 #d8a830,3px 3px 0 #a8781c,4px 4px 0 #3a2a0a,5px 5px 0 #000}
#logo[data-look="deep"] .ep{color:#f0c8d8}
/* TERMINUS's (Book 5): chrome over the machine's red */
#logo[data-look="terminus"] .cmd{color:#ff5a3a;text-shadow:1px 1px 0 #3a0604}
#logo[data-look="terminus"] .poom{color:#e8eef4;text-shadow:1px 1px 0 #8e99a7,2px 2px 0 #646f7d,3px 3px 0 #c41a10,4px 4px 0 #3a0604,5px 5px 0 #000}
#logo[data-look="terminus"] .ep{color:#c8d0e0}

/* ---- the UI's colours, by theme (game.js dressFor sets #ui's data-look);
   classic is the original EGA blue box ---- */
#ui{--ui-bg:var(--ega1);--ui-text:var(--ega15);--ui-accent:var(--ega11);--ui-head:var(--ega14);--ui-sel:#aa0000;
  --ui-tab:var(--ega9);--ui-body:#dfe8ff;--ui-dim:var(--ega7);--ui-me:var(--ega12);
  --ui-chip:#000;--ui-chip-edge:var(--ega8)}
/* the wasteland's is a rusted steel plate, amber lettering, rust highlight */
#ui[data-look="wasteland"]{--ui-bg:#2e1e16;--ui-text:#f0d8b0;--ui-accent:#e0a050;--ui-head:#ffd23f;--ui-sel:#8a3218;
  --ui-tab:#7a4a2a;--ui-body:#e8d4b4;--ui-dim:#a08060;--ui-me:#ff8a50;
  --ui-chip:#2e1e16;--ui-chip-edge:#8a5a32}
/* Thrum's: violet-black glass, teal edges, the visor's amber in the heads,
   a violet bar for the selection */
#ui[data-look="thrum"]{--ui-bg:#130c1f;--ui-text:#dce8ec;--ui-accent:#6fe0c8;--ui-head:#ffb02e;--ui-sel:#4b2e6a;
  --ui-tab:#2f6e6a;--ui-body:#c8dce0;--ui-dim:#8a97a0;--ui-me:#f48cd0;
  --ui-chip:#130c1f;--ui-chip-edge:#2fb3a0}
#ui[data-look="thrum"] *{scrollbar-color:#2f6e6a transparent}
#ui[data-look="thrum"] ::-webkit-scrollbar-thumb{background:#2f6e6a;background-clip:padding-box}
#ui[data-look="thrum"] ::-webkit-scrollbar-thumb:hover{background:#2fb3a0;background-clip:padding-box}
/* Isla Garra's: the radio, green phosphor on black glass in slate, the
   alert's red for the selection */
#ui[data-look="claw"]{--ui-bg:#0c1014;--ui-text:#d8e8dc;--ui-accent:#5aff8a;--ui-head:#5aff8a;--ui-sel:#7a1020;
  --ui-tab:#2c343e;--ui-body:#c0d4c4;--ui-dim:#7a8a80;--ui-me:#ff7080;
  --ui-chip:#0c1014;--ui-chip-edge:#4a5664}
#ui[data-look="claw"] *{scrollbar-color:#4a5664 transparent}
#ui[data-look="claw"] ::-webkit-scrollbar-thumb{background:#4a5664;background-clip:padding-box}
#ui[data-look="claw"] ::-webkit-scrollbar-thumb:hover{background:#5aff8a;background-clip:padding-box}
/* Raptura's: deep teal glass in gold, a deep red for the selection */
#ui[data-look="deep"]{--ui-bg:#081a22;--ui-text:#efe4c8;--ui-accent:#3ff0e0;--ui-head:#f8d860;--ui-sel:#7a2434;
  --ui-tab:#1e4a5a;--ui-body:#d8dccc;--ui-dim:#8a9a98;--ui-me:#ff4fa8;
  --ui-chip:#081a22;--ui-chip-edge:#a8781c}
#ui[data-look="deep"] *{scrollbar-color:#a8781c transparent}
#ui[data-look="deep"] ::-webkit-scrollbar-thumb{background:#a8781c;background-clip:padding-box}
#ui[data-look="deep"] ::-webkit-scrollbar-thumb:hover{background:#f8d860;background-clip:padding-box}
/* TERMINUS's: black glass in gunmetal, the tracker's green, the machine's red */
#ui[data-look="terminus"]{--ui-bg:#0a0c10;--ui-text:#dfe6ee;--ui-accent:#5aff8a;--ui-head:#ff5a3a;--ui-sel:#7a0e08;
  --ui-tab:#323a46;--ui-body:#c8d0da;--ui-dim:#8e99a7;--ui-me:#ffb02e;
  --ui-chip:#0a0c10;--ui-chip-edge:#646f7d}
#ui[data-look="terminus"] *{scrollbar-color:#646f7d transparent}
#ui[data-look="terminus"] ::-webkit-scrollbar-thumb{background:#646f7d;background-clip:padding-box}
#ui[data-look="terminus"] ::-webkit-scrollbar-thumb:hover{background:#ff5a3a;background-clip:padding-box}
/* the canon scrollbar (gk-title.js) is steel blue; a themed UI repaints it */
#ui[data-look="wasteland"] *{scrollbar-color:#8a5a32 transparent}
#ui[data-look="wasteland"] ::-webkit-scrollbar-thumb{background:#8a5a32;background-clip:padding-box}
#ui[data-look="wasteland"] ::-webkit-scrollbar-thumb:hover{background:#c07a40;background-clip:padding-box}

/* ---- overlays ---- */
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:5}
.box{background:var(--ui-bg);color:var(--ui-text);border:1px solid var(--ui-accent);box-shadow:0 0 0 1px var(--ui-bg),0 0 0 2px var(--ui-text),3px 3px 0 2px #000;
  padding:8px 10px}
.box h2{margin:0 0 6px;font-size:8px;font-weight:400;color:var(--ui-head);letter-spacing:1px;text-transform:uppercase}
.box p{margin:0 0 6px}
.box p:last-child{margin-bottom:0}
.box b{color:var(--ui-head);font-weight:400}
.hint{color:var(--ui-accent);font-size:6px;text-align:right;margin-top:6px!important}
.msg{width:220px;text-align:left}
.msg > img{display:block;margin:0 auto 8px}
.msg input{font:inherit;width:100%;box-sizing:border-box;background:#000;color:var(--ui-head);border:1px solid var(--ui-accent);padding:3px;outline:none;margin:2px 0 4px;-webkit-user-select:text;user-select:text}
.iconrow{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.card{text-align:center;min-width:170px}
.card .small{font-size:6px;color:var(--ui-accent)}

.menu{min-width:150px}
.menu .items{display:flex;flex-direction:column;gap:1px}
.menu .gap{height:4px}
.menu button,.page .tabs button,.page .x{font:inherit;color:var(--ui-text);background:transparent;border:0;padding:2px 4px;cursor:pointer;
  display:flex;align-items:center;gap:4px;text-align:left}
.menu button .lbl{flex:1}
.menu button .meta{color:var(--ui-accent);font-size:6px}
.menu button kbd{font-size:6px;color:var(--ui-dim);min-width:8px;text-align:right}
.menu button .cur{color:var(--ui-head);visibility:hidden;width:7px}
.menu button:focus{outline:none}
.menu button.sel{background:var(--ui-sel)}
.menu button.sel .cur{visibility:visible;animation:blink .5s steps(1) infinite}
.menu button:disabled{color:var(--ega8)}
@keyframes blink{50%{visibility:hidden}}
.foot{margin-top:6px;font-size:6px;color:var(--ui-accent)}
.foot a,.credit a,.gk-credit a{color:var(--ui-accent)}
.ask .menu{max-width:230px}
.books .menu{min-width:190px}
.ask h2{text-transform:none;line-height:1.6}

.title{place-items:end end;padding:0 10px 14px 0;box-sizing:border-box}
/* the credit sits under the panel, small and muted, the link in the accent */
.title .below{position:absolute;right:11px;bottom:4px;font-size:6px;color:var(--ui-dim)}
.title .menu{min-width:150px;padding:4px 7px}
.title .menu button{padding:1px 4px;line-height:1.25}
.title .menu .gap{height:3px}
.title .foot{margin-top:4px}

.page{width:286px;height:172px;display:flex;flex-direction:column;box-sizing:border-box}
.page .phead{display:flex;align-items:center}
.page .phead h2{flex:1;margin:0}
.page .x{font-size:10px;padding:0 2px}
.page .tabs{display:flex;gap:2px;margin:4px 0}
.page .tabs button{padding:2px 4px;border:1px solid var(--ui-tab);font-size:6px}
.page .tabs button[aria-selected="true"]{background:var(--ui-sel);border-color:var(--ui-head);color:var(--ui-head)}
.page .pbody{flex:1;overflow-y:auto;font-size:6px;line-height:1.7;padding-right:4px;color:var(--ui-body)}
.page .pbody p{margin:0 0 6px}
.page .pbody table{border-collapse:collapse}
.page .pbody td{padding:1px 6px 1px 0;vertical-align:top}
/* a key and its alternative stay on one line; the description wraps instead */
.page .pbody td:first-child{white-space:nowrap}
.page .entries{display:flex;flex-direction:column;gap:6px}
.page .entry{display:flex;gap:8px;align-items:center}
.page .entry .pic{width:48px;flex:none;display:grid;place-items:center}
.page .entry .pic img{max-width:48px;height:auto}
.scores{width:100%;font-size:7px}
.scores td.num{text-align:right;color:var(--ui-head)}
.scores tr.me td{color:var(--ui-me)}

.status{width:220px}
.sgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:7px}
.sgrid .k{color:var(--ui-accent)}
.sgrid img{margin-right:3px}

/* ---- map label, toasts, sound ---- */
#maplabel{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:var(--ui-chip);border:1px solid var(--ui-chip-edge);
  padding:2px 6px;font-size:6px;color:var(--ui-head);white-space:nowrap;z-index:2}
/* the keys, once, in the first level a browser plays (game.js keyStrip) */
#keystrip{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);background:var(--ui-chip);border:1px solid var(--ui-chip-edge);
  padding:3px 7px;font-size:6px;line-height:1.8;color:var(--ui-text);text-align:center;white-space:nowrap;z-index:3;transition:opacity 1s ease}
#keystrip kbd{color:var(--ui-head)}
#keystrip.fading{opacity:0}
#toast{position:absolute;left:50%;top:30px;transform:translateX(-50%);background:var(--ui-bg);border:1px solid var(--ui-accent);
  padding:3px 6px;font-size:6px;max-width:260px;text-align:center;z-index:6}
#snd{position:absolute;right:3px;top:3px;z-index:7;width:13px;height:13px;padding:0;display:grid;place-items:center;
  background:var(--ui-chip);border:1px solid var(--ui-chip-edge);cursor:pointer}
#snd img{display:block}
[hidden]{display:none!important}

/* ---- touch ---- */
#touch{position:fixed;inset:auto 0 0 0;height:0;z-index:10;pointer-events:none}
#touch button{position:fixed;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid rgba(85,255,255,.5);
  background:rgba(0,0,170,.35);color:#fff;font:10px var(--pix);touch-action:none}
#touch button.on{background:rgba(255,85,85,.55)}
#touch [data-a=left]{left:12px;bottom:24px}
#touch [data-a=right]{left:82px;bottom:24px}
#touch [data-a=up]{left:47px;bottom:92px;width:46px;height:46px}
#touch [data-a=down]{left:152px;bottom:24px;width:46px;height:46px}
#touch [data-a=jump]{right:12px;bottom:24px}
#touch [data-a=fire]{right:82px;bottom:24px}
#touch [data-a=pogo]{right:47px;bottom:92px;width:46px;height:46px}
#touch [data-a=pause]{right:12px;top:12px;width:40px;height:40px;bottom:auto}
#touch [data-a=status]{right:60px;top:12px;width:40px;height:40px;bottom:auto}
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="320" height="200" aria-label="Commander Poom"></canvas>
  <div id="ui">
    <div id="logo"><div class="cmd">COMMANDER</div><div class="poom">POOM</div><div class="ep">Book One: Wastelandia</div></div>
    <div id="maplabel" hidden></div>
    <div id="toast" hidden role="status"></div>
    <div id="keystrip" hidden><kbd>Ctrl</kbd>/<kbd>Z</kbd> jump &middot; <kbd>Alt</kbd>/<kbd>X</kbd> pogo &middot; <kbd>Space</kbd>/<kbd>C</kbd> fire<br><kbd>&uarr;</kbd> doors and signs &middot; <kbd>Enter</kbd> status &middot; <kbd>Esc</kbd> pause</div>
    <button id="snd" aria-label="Sound" aria-pressed="true" title="Sound (M)"></button>
  </div>
</div>
<div id="touch" hidden>
  <button data-a="left" aria-label="Left">◀</button><button data-a="right" aria-label="Right">▶</button>
  <button data-a="up" aria-label="Up">▲</button><button data-a="down" aria-label="Down">▼</button>
  <button data-a="jump" aria-label="Jump">JUMP</button><button data-a="fire" aria-label="Fire">FIRE</button>
  <button data-a="pogo" aria-label="Pogo">POGO</button>
  <button data-a="pause" aria-label="Pause">II</button><button data-a="status" aria-label="Status">?</button>
</div>
<script src="js/gk-title.js?v=6080c669"></script>
<script src="js/art.js?v=9d5bda37"></script>

<script src="js/art-book4.js?v=34055d31"></script>
<script src="js/books/B.js?v=bf40dfaa"></script>
<script src="js/books/C.js?v=5093ea77"></script>
<script src="js/books/D.js?v=c700b3ed"></script>
<script src="js/books/E.js?v=42dd66b9"></script>
<script src="js/books/F.js?v=6610960a"></script>
<script src="js/books/G.js?v=5775b3dc"></script>
<script src="js/books/H.js?v=5263ba43"></script>
<script src="js/books/I.js?v=15f4fdd4"></script>
<script src="js/game.js?v=debee082"></script>
</body>
</html>
