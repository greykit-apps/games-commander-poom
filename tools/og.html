<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og.png</title>
<!-- The share card, drawn by the game itself. Open this page from the repo
     root over http (python3 -m http.server), wait for the title to read
     "ready", then save the canvas as og.png: right-click > Save image, or run
     document.querySelector("canvas").toDataURL() and decode it. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>body{margin:0;background:#222}canvas{display:block}iframe{position:absolute;left:-9999px;width:640px;height:400px;border:0}</style>
</head>
<body>
<canvas width="1200" height="630"></canvas>
<script>
/* Four Books through four windows: a slice of one level from each, Poom
   standing in it in that Book's gear, and the logo running across them,
   each window drawing it in its own Book's colours (index.html's
   #logo[data-look]).

   The game runs in a hidden frame, dropped into a level by its ?level=
   debug hook; each window is drawn with the game's own drawLevel(), the
   scorebox left out. A screen is 200 rows and a window needs 210, so the
   last ten come from a second draw ten rows further down.

   A window: level id, its left and top in level pixels, and where Poom's
   feet go. */
const WINDOWS = [
  { level: "H05", x: 410, y: 174, px: 446, foot: 322,
    cmd: ["#ffb85a", "#5a2410"], poom: ["#ffd23f", "#d07a36", "#d07a36", "#7a3a1c", "#7a3a1c"] },
  { level: "C03", x: 500, y: 190, px: 524, foot: 352,
    cmd: ["#6fe0c8", "#10504e"], poom: ["#e6fff8", "#6fe0c8", "#2fb3a0", "#613d86", "#382252"] },
  { level: "D03", x: 610, y: 112, px: 640, foot: 302,
    cmd: ["#5aff8a", "#0a3a18"], poom: ["#e8f0f4", "#7a8898", "#4a5664", "#b01828", "#4a0810"] },
  { level: "E03", x: 600, y: 310, px: 618, foot: 496,
    cmd: ["#3ff0e0", "#0a3a40"], poom: ["#fff4d0", "#f8d860", "#d8a830", "#a8781c", "#3a2a0a"] },
];
const SW = 100, SH = 210, K = 3;
const c = document.querySelector("canvas"), g = c.getContext("2d");
g.imageSmoothingEnabled = false;

const frame = document.createElement("iframe");
frame.src = "../index.html?level=" + WINDOWS[0].level;
document.body.appendChild(frame);
const wait = ms => new Promise(r => setTimeout(r, ms));

frame.onload = async () => {
  await wait(500);
  const game = frame.contentWindow, screen = game.document.getElementById("screen");
  /* the game's top-level consts (G, T) aren't window properties: reach
     them through its own eval */
  WINDOWS.forEach((w, i) => {
    game.eval(`startLevel(${JSON.stringify(w.level)});
      const p = G.lv.p; p.x = ${w.px}; p.y = ${w.foot} - p.h; p.vx = p.vy = 0; p.face = 1;
      p.onGround = true; p.pogo = false; p.climbing = false; p.shootT = 0; p.anim = 0;
      window.__hud = drawHud; drawHud = () => {};
      G.cam.x = ${w.x}; G.cam.y = ${w.y}; drawLevel();`);
    const s = document.createElement("canvas"); s.width = SW; s.height = SH;
    const x = s.getContext("2d");
    x.drawImage(screen, 0, 0, SW, 200, 0, 0, SW, 200);
    game.eval(`G.cam.y = ${w.y + 10}; drawLevel(); drawHud = window.__hud;`);
    x.drawImage(screen, 0, 190, SW, 10, 0, 200, SW, 10);
    g.drawImage(s, 0, 0, SW, SH, i * SW * K, 0, SW * K, SH * K);
  });

  /* the seams */
  g.fillStyle = "#000";
  for (let i = 1; i < WINDOWS.length; i++) g.fillRect(i * SW * K - 2, 0, 4, 630);

  /* the logo, clipped to each window and dressed in that Book's colours */
  const inSlice = (i, fn) => { g.save(); g.beginPath(); g.rect(i * SW * K + (i ? 2 : 0), 0, SW * K - (i ? 2 : 0) - (i < WINDOWS.length - 1 ? 2 : 0), 630); g.clip(); fn(); g.restore(); };
  await document.fonts.load("48px 'Press Start 2P'");
  g.textAlign = "center"; g.textBaseline = "top";
  WINDOWS.forEach((b, i) => inSlice(i, () => {
    g.font = "36px 'Press Start 2P'";
    g.fillStyle = b.cmd[1]; g.fillText("COMMANDER", 603, 73);
    g.fillStyle = b.cmd[0]; g.fillText("COMMANDER", 600, 70);
    g.font = "120px 'Press Start 2P'";
    g.fillStyle = "#000"; g.fillText("POOM", 620, 140);
    for (let k = 4; k >= 1; k--) { g.fillStyle = b.poom[k]; g.fillText("POOM", 600 + k * 4, 120 + k * 4); }
    g.fillStyle = b.poom[0]; g.fillText("POOM", 600, 120);
  }));
  frame.remove();
  document.title = "ready";
};
</script>
</body>
</html>
